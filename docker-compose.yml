services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/todos.db
    volumes:
      - todo-data:/app/data
    restart: unless-stopped

volumes:
  todo-data:
